name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || true

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Bundle
        env:
          SWIFT_BUILD: swift build
        run: scripts/bundle.sh

      - name: Check universal binary
        run: lipo -archs dist/EyesDriven2me.app/Contents/MacOS/EyesDriven2me | grep -q "x86_64" && lipo -archs dist/EyesDriven2me.app/Contents/MacOS/EyesDriven2me | grep -q "arm64"

      - name: Disk image (.dmg)
        run: scripts/make-dmg.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EyesDriven2me
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
